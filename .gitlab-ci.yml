workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test

python:shell:
  stage: test
  image: python:3.11-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends bash
    - rm -rf /var/lib/apt/lists/*
  script:
    - python -m compileall ytdlpchopid scripts
    - bash -n bin/yt_audio_id.sh bin/ytdlpchopid scripts/*.sh
